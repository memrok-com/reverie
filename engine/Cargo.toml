[package]
name = "reverie-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "Apache-2.0"
repository = "https://github.com/memrok-com/reverie"
description = "Portable subjective chronological memory for an RPG companion"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
